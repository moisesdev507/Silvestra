<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kaya Live</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0f12">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <div class="hud-title">KAYA LIVE</div>
      <div class="hud-badge" id="badgeEstado">REPOSO</div>
    </header>

    <main class="hud-center">
      <div class="orbe-wrapper" id="btnOrbe">
        <div class="orbe-pulso" id="orbePulso"></div>
        <div class="orbe-nucleo" id="orbeNucleo"></div>
      </div>
      <div class="subtitulos" id="txtSubtitulo">Toca el orbe para iniciar</div>
    </main>

    <video id="videoPreview" autoplay playsinline muted class="video-oculto"></video>
    <canvas id="canvasFrame" class="video-oculto"></canvas>

    <footer class="hud-footer">
      <button class="hud-btn" id="btnMute" title="Silenciar / Activar Micrófono">
        <span class="btn-icon" id="iconMute">🎤</span>
        <span class="btn-label">Mic</span>
      </button>

      <button class="hud-btn" id="btnFoto" title="Mirada puntual (1 foto)">
        <span class="btn-icon">📷</span>
        <span class="btn-label">Mirada</span>
      </button>

      <button class="hud-btn" id="btnPaseo" title="Modo paseo (Cámara 1 FPS)">
        <span class="btn-icon" id="iconPaseo">👁️</span>
        <span class="btn-label">Paseo</span>
      </button>

      <button class="hud-btn" id="btnCamara" title="Cambiar cámara Frontal/Trasera">
        <span class="btn-icon">🔄</span>
        <span class="btn-label">Giro</span>
      </button>

      <button class="hud-btn btn-danger" id="btnDesconectar" title="Pausar / Desconectar">
        <span class="btn-icon">⏹️</span>
        <span class="btn-label">Salir</span>
      </button>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
